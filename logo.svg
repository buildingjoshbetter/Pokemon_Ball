<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- LED glow effect -->
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0"/>
    </radialGradient>
    <!-- Subtle shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <!-- Circuit trace pattern -->
    <pattern id="circuit" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <circle cx="10" cy="10" r="1" fill="#3B82F6" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background circle (subtle shadow) -->
  <circle cx="200" cy="200" r="180" fill="none" filter="url(#shadow)"/>

  <!-- Top hemisphere - Red -->
  <path d="M 20 200 A 180 180 0 0 1 380 200" fill="#EE1515"/>

  <!-- Bottom hemisphere - White -->
  <path d="M 20 200 A 180 180 0 0 0 380 200" fill="#F8F8F8" stroke="#DDD" stroke-width="0.5"/>

  <!-- Center band - Black -->
  <rect x="20" y="185" width="360" height="30" fill="#222222" rx="2"/>

  <!-- Circuit traces on band -->
  <line x1="80" y1="200" x2="140" y2="200" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
  <line x1="140" y1="200" x2="140" y2="192" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
  <circle cx="140" cy="192" r="2.5" fill="#3B82F6" opacity="0.6"/>
  <circle cx="80" cy="200" r="2" fill="#3B82F6" opacity="0.6"/>

  <line x1="260" y1="200" x2="320" y2="200" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
  <line x1="260" y1="200" x2="260" y2="208" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
  <circle cx="260" cy="208" r="2.5" fill="#3B82F6" opacity="0.6"/>
  <circle cx="320" cy="200" r="2" fill="#3B82F6" opacity="0.6"/>

  <!-- Center button - outer ring -->
  <circle cx="200" cy="200" r="36" fill="#222222" stroke="#333" stroke-width="2"/>

  <!-- Center button - inner -->
  <circle cx="200" cy="200" r="28" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>

  <!-- Circuit traces inside button -->
  <line x1="200" y1="182" x2="200" y2="188" stroke="#444" stroke-width="1"/>
  <line x1="200" y1="212" x2="200" y2="218" stroke="#444" stroke-width="1"/>
  <line x1="182" y1="200" x2="188" y2="200" stroke="#444" stroke-width="1"/>
  <line x1="212" y1="200" x2="218" y2="200" stroke="#444" stroke-width="1"/>

  <!-- LED glow at center -->
  <circle cx="200" cy="200" r="30" fill="url(#ledGlow)"/>
  <circle cx="200" cy="200" r="8" fill="#3B82F6" opacity="0.9"/>
  <circle cx="200" cy="200" r="4" fill="#FFFFFF" opacity="0.8"/>

  <!-- Outer edge -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#222222" stroke-width="3"/>
</svg>
